<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./CSS/startscreen.css" />
    <link rel="stylesheet" href="./CSS/gameover.css" />
    <link rel="stylesheet" href="./CSS/assets.css">
    <link rel="shortcut icon" href="./img/pepe.png" />
    <title>El pollo loco</title>
    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/smallchicken.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/status-bar-coins.class.js"></script>
    <script src="./classes/status-bar-bottles.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./javascript/levels/level1.js"></script>
    <script src="./javascript/game.js"></script>
    <script src="./javascript/fullscreen.js"></script>
    <script src="./javascript/sound.js"></script>
  </head>
  <body onload="">
    <header class="headline">
      <img class="h1" src="./img/h1.png" alt="titel" />
      <img class="description" src="./img/h2.png" alt="description" />
    </header>
    <main>
      <div id="canvas-container">
        <canvas id="canvas" width="720" height="480"> </canvas>
        <button class="mute-music" id="muteMusicBtn" onclick="toggleMusic()">🎶</button>
        <button class="mute-sound-effects" id="muteSndBtn" onclick="toggleSoundEffects()">🔊</button>
        <button class="fullscreen-btn" onclick="fullscreen()">⛶</button>
        <button class="reset-btn" id="resetBtn" onclick="resetGame()" style="display:none">↩</button>
        <div class="start-screen" id="startScreen">
          <img
            src="./img/9_intro_outro_screens/start/startscreen_1.png"
            alt="Start Screen"
          />
          <button class="start-btn" onclick="startGame()">Start Game</button>
        </div>
        <div class="game-over-screen" id="gameOverScreen">
          <img
            src="./img/9_intro_outro_screens/game_over/game over.png"
            alt="Game Over"
          />
          <button class="start-btn" onclick="restartGame()">Play Again</button>
        </div>
        <div class="win-screen" id="winScreen">
          <img src="./img/You won, you lost/You Win A.png" alt="You Win" />
          <button class="start-btn" onclick="restartGame()">Play Again</button>
        </div>
      </div>
      <section class="controls-section">
        <div class="controls_1">
          <p>&#8594; walk right</p>
          <p>&#8592; walk left</p>
        </div>
        <img class="character" src="./img/pepe.png" alt="character" />
        <div class="controls_2">
          <p>SPACE = jump</p>
          <p>D = throw bottle</p>
        </div>
      </section>
    </main>
  </body>
</html>
