<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./CSS/startscreen.css" />
    <link rel="stylesheet" href="./CSS/gameover.css" />
    <link rel="stylesheet" href="./CSS/assets.css" />
    <link rel="stylesheet" href="./CSS/game_control_modal.css">
    <link rel="shortcut icon" href="./img/pepe.png" />
    <title>El pollo loco</title>
    <script src="./javascript/intervals.js" defer></script>
    <script src="./classes/drawable-object.class.js" defer></script>
    <script src="./classes/movable-object.class.js" defer></script>
    <script src="./classes/background-object.class.js" defer></script>
    <script src="./classes/level.class.js" defer></script>
    <script src="./classes/keyboard.class.js" defer></script>
    <script src="./classes/throwable-object.class.js" defer></script>
    <script src="./classes/character.class.js" defer></script>
    <script src="./classes/basechicken.class.js" defer></script>
    <script src="./classes/chicken.class.js" defer></script>
    <script src="./classes/smallchicken.class.js" defer></script>
    <script src="./classes/endboss.class.js" defer></script>
    <script src="./classes/cloud.class.js" defer></script>
    <script src="./classes/coin.class.js" defer></script>
    <script src="./classes/bottle.class.js" defer></script>
    <script src="./classes/status-bar-base.class.js" defer></script>
    <script src="./classes/status-bar.class.js" defer></script>
    <script src="./classes/status-bar-coins.class.js" defer></script>
    <script src="./classes/status-bar-bottles.class.js" defer></script>
    <script src="./classes/status-bar-endboss.class.js" defer></script>
    <script src="./classes/world.class.js" defer></script>
    <script src="./javascript/levels/level1.js" defer></script>
    <script src="./javascript/game.js" defer></script>
    <script src="./javascript/fullscreen.js" defer></script>
    <script src="./javascript/sound.js" defer></script>
  </head>
  <body onload="loadSoundSettings(); initMobileControls();">
   <div id="rotate-device-hint">
    <div class="hint-content">
     <div class="phone-icon">🔄📱</div>
     <p>Please rotate your device to play!</p>
    </div>
   </div>
    <header class="headline">
      <img class="h1" src="./img/h1.png" alt="titel" />
      <img class="description" src="./img/h2.png" alt="description" />
    </header>
    <main>
      <div id="canvas-container">
        <canvas id="canvas" width="720" height="480"> </canvas>
         <button class="mute-music" id="muteMusicBtn" onclick="toggleMusic()">
          <span class="icon-on">🎶</span>
          <span class="icon-off">🔕</span>
         </button>
         <button class="mute-sound-effects" id="muteSndBtn" onclick="toggleSoundEffects()">
          <span class="icon-on">🔊</span>
          <span class="icon-off">🔇</span>
         </button>
         <button class="info-btn"  id="infoBtn" onclick="toggleInfo()">❓</button>
         <button class="fullscreen-btn" id= "enter-fullscreen" onclick="fullscreen()">⛶</button>
         <button class="reset-btn" id="resetBtn" onclick="resetGame()">↩</button>
         <button class="pause-btn" id="pauseBtn" onclick="togglePause()">
          <span class="icon-on">⏸</span>
          <span class="icon-off">▶</span>
         </button>
          <div id="loadingScreen" style="display:none;">
          <img class="loading-gif" src="./img/animated_pepe.gif" alt="Loading..."/>
          <p id="loadingProgress">Loading... 0%</p>
         </div>
          <div class="start-screen" id="startScreen">
           <img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Screen"/>
            <button class="start-game-btn" onclick="startGame()">Start Game</button>
            <button class="info-btn-startscreen" id="infoBtnStart" onclick="toggleInfo()">❓</button>
            <a class="impressum-link" href="impressum.html" target="_blank">Impressum</a>
          </div>
          <div class="game-over-screen" id="gameOverScreen">
           <img src="./img/9_intro_outro_screens/game_over/game over.png" alt="Game Over"/>
            <div class="btn-container">
             <button class="restart-btn" onclick="restartGame()">&#128128;Try Again</button>
             <button class="home-btn" onclick="resetGame()">🏠 Home</button>
            </div>
          </div>
          <div class="win-screen" id="winScreen">
           <img src="./img/You won, you lost/You Win A.png" alt="You Win" />
            <div class="btn-container">
             <button class="restart-btn" onclick="restartGame()">Play Again</button>
             <button class="home-btn" onclick="resetGame()">🏠 Home</button>
            </div>
          </div>
           <div id="fullscreenHint" class="fullscreen-hint">
            Press ESC to exit fullscreen
           </div>
            <div class="mobile-controls" id="mobileControls">
             <div class="mobile-controls-left">
              <button class="mobile-btn" id="btnLeft">&#8592;</button>
              <button class="mobile-btn" id="btnRight">&#8594;</button>
             </div>
             <div class="mobile-controls-right">
              <button class="mobile-btn" id="btnJump">&#8679;</button>
              <button class="mobile-btn" id="btnThrow">🍶</button>
             </div>
            </div>
      </div>
    </main>
     <dialog id="infoModal">
      <div class="info-modal-content">
       <h2>Controls</h2>
        <button class="close-modal-btn" onclick="toggleInfo()">✖</button>
         <ul>
          <li>⬅️ ➡️ &nbsp; Walk</li>
          <li>[SPACE] &nbsp; Jump</li>
          <li>D &nbsp; Throw bottle</li>
          <li>🐔 &nbsp; Jump on chicken to defeat them</li>
          <li>🍶 &nbsp; Collect bottles</li>
          <li>🪙 &nbsp; Collect coins</li>
         </ul>      
      </div>
     </dialog>
  </body>
</html>
